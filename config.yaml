# Single source of truth for paths, revisions, seeds and hyper-parameters.
# Notebooks read this file through common.colab_setup.setup(); nothing is hard-coded in them.

project:
  name: marwari-eot
  drive_root: /content/drive/MyDrive/marwari-eot   # every artifact that matters lives here
  local_cache: /content/cache                      # fast local copy of feature shards
  repo_dir: /content/marwari-eot                   # where the notebooks clone this repo
  repo_url: https://github.com/krishagarwal314/marwari-eot.git
  smart_turn_repo_url: https://github.com/pipecat-ai/smart-turn.git
  smart_turn_commit: 4786657e242dfe77dd138699ac564ee074a2a543   # code our model/feature logic is copied from
  smart_turn_dir: /content/smart-turn

# Sub-directories of drive_root (created by setup()).
dirs:
  raw: data/raw
  clips: data/clips
  labels: data/labels
  splits: data/splits
  test_sets: data/test_sets
  features: features
  checkpoints: checkpoints
  models: models
  logs: logs
  reports: reports
  cache: cache

hf:
  smart_turn_model_repo: pipecat-ai/smart-turn-v3
  smart_turn_model_revision: f766f81d3cfdf7737ac64aad813d91bbfd56bf93
  smart_turn_onnx:                   # file names inside smart_turn_model_repo
    v3.0: smart-turn-v3.0.onnx
    v3.1_cpu: smart-turn-v3.1-cpu.onnx
    v3.1_gpu: smart-turn-v3.1-gpu.onnx
    v3.2_cpu: smart-turn-v3.2-cpu.onnx   # static int8 (QDQ)
    v3.2_gpu: smart-turn-v3.2-gpu.onnx   # fp32 - source of fine-tuning weights
  data_train: pipecat-ai/smart-turn-data-v3.2-train
  data_train_revision: f8c95d284595defb6b88a715c356cbc5c31b7ad1
  data_test: pipecat-ai/smart-turn-data-v3.2-test
  data_test_revision: dfc179241fee65b0efe81ca37786f41ce26f38ec
  vaani: ARTPARK-IISc/Vaani
  vaani_revision: 9e6ed4f94f7060e633cbc500480623ae7521522c
  whisper:
    tiny: openai/whisper-tiny
    base: openai/whisper-base

# Names of Colab Secrets (values are never stored in code).
secrets:
  required: [HF_TOKEN, GEMINI_API_KEY]
  optional: [WANDB_API_KEY]

seed: 1234          # for data processing / sampling
seeds: [0, 1, 2]    # training seeds; every config runs all three

audio:
  sample_rate: 16000
  window_s: 8              # Smart Turn input window; audio is left-padded / truncated to the last 8 s
  n_mels: 80
  n_frames: 800
  trailing_silence_ms: 200

features:
  dtype: float16           # 80x800 per clip: fp16 = 128 KB, fp32 = 256 KB. 06 checks fp16 vs fp32 parity.
  shard_size: 2048         # clips per shard

runtime:
  batch_probe_start: 512   # find largest batch: start here, halve on OOM
  batch_headroom: 0.9      # then use 90% of the max that fit
  effective_batch: 384     # kept fixed across GPUs via gradient accumulation (Smart Turn used 384)
  eval_batch: 256
  log_gpu_every: 100
  min_gpu_util: 80
  compile_probe_steps: 200
  num_workers: null        # null -> os.cpu_count()
  prefetch_factor: 4

checkpoint:
  every_steps: 500
  keep_last: 3
  best_metric: dev_balanced_accuracy

# ---- Phase 1 -------------------------------------------------------------------------------
vaani:
  # Folders are processed in this order; each source parquet shard gets a done marker, so you can
  # stop after any folder. Raw shards are downloaded to local disk and deleted after processing.
  folders:
    - audio/Marwari                 # ~18 GB, 158 h (9.0 h transcribed: Nagaur 5.9 h, Churu 3.1 h). Main source.
    - audio/Mewari
    - audio/Jaipuri
    - audio/Shekhawati
    - audio/Harauti
    - audio/Bagri
    - audio/Wagdi
    - audio/Rajasthani              # ~21 GB, 188 h, related dialect only
  # audio/Rajasthan/<district> folders are not listed: per the Vaani README their Marwari hours
  # (Barmer 0.1, Bikaner 10.1, Churu 41.2, Jaipur 11.6, Jaisalmer 26.4, Nagaur 68.8 = 158.3 h)
  # equal the Marwari folder total, so they would only add duplicates and Hindi.
  skip_folders: []                  # e.g. [audio/Rajasthani] to save time
  # Row-level grouping by the `language` column (lower-cased, stripped). Rows in no group are dropped.
  marwari_languages: [marwari, marwadi]
  related_languages: [rajasthani, mewari, dhundhari, jaipuri, shekhawati, harauti, hadoti, bagri, wagdi, mewati, malvi]

clips:
  version: v1
  max_recordings: 20000          # fast track: random subset of Marwari recordings (null = all ~80k)
  rec_sample_frac: 0.125         # fast track (02_fast_clips): keep 1 in 8 Marwari recordings (~10k, ~19 h)
  vad_threshold: 0.5
  min_silence_ms: 100               # silero: shortest gap that splits two speech segments
  speech_pad_ms: 30                 # silero pads segments, so measured gaps are ~60 ms shorter than true gaps
  pause_min_ms: 200                 # incomplete cut points: internal pauses of 200-800 ms
  pause_max_ms: 800
  min_context_s: 1.0                # need at least this much audio before an incomplete cut
  max_incomplete_per_rec: 2
  target_complete_frac: 0.6         # applied after labelling (03), per split
  telephony_frac_train: 0.5         # flag set here, augmentation applied at feature extraction (06)

splits:
  version: v1                       # frozen once written; never reassigned
  dev_frac: 0.1
  test_frac: 0.1                    # test speakers are held back for Phase 2
  stratify_by: [district, gender]

labelling:
  version: v1
  model: gemini-3.5-flash-lite     # free tier: Flash = 20 req/day, Flash Lite = 500 req/day
  fallback_models: [gemini-3.1-flash-lite]   # used when the previous model's daily quota runs out
  prompt: >-
    You will hear a short clip of a person speaking Marwari (a Rajasthani language). The clip ends
    at a pause. Has the speaker finished their thought, or will they continue?
    Answer COMPLETE, INCOMPLETE or UNSURE, and give your confidence from 0 to 1.
    Also say which language is mainly spoken: MARWARI, HINDI, MIXED or OTHER.
  confident_threshold: 0.8          # LLM label overrides the position rule only above this confidence
  thinking_budget: null            # Gemini 3 models do not take thinking_budget
  workers: 4
  requests_per_minute: 12           # Flash Lite free tier allows 15/min
  batch_size: 20                    # clips per request in 03_fast_label (8 s each)
  max_retries: 6
  label_splits: [train, dev, test]  # test is labelled only to help draw the Phase 2 set; never trained on
  max_clips: null                   # cap for a trial run, e.g. 500
  check_sample_size: 200
  agreement_required: 0.90
  drop_hindi: true                  # clips Gemini or the transcript marks as Hindi are kept out of the Marwari sets

text:                               # 02b: transcript cues
  align_model: facebook/mms-1b-all
  align_lang: hin                   # Devanagari CTC adapter; covers Marwari transcripts (ळ -> ल)
  align_tolerance_ms: 60

fast_train:                         # 04_fast_train_eval (one config, one seed)
  run_name: fast_m50_seed0
  seed: 0
  batch_size: 64
  marwari_share: 0.5                # half of every batch Marwari, half Smart Turn replay
  epochs: 4                         # passes over the Marwari training clips
  lr_head: 1.0e-4
  lr_encoder: 2.0e-5
  weight_decay: 0.01
  warmup_frac: 0.05
  eval_every: 100
  patience: 4                       # evals without dev improvement before stopping
  replay_train_per_lang: 450        # ~10k replay clips (23 languages); 10% of them become replay dev
  replay_test_per_lang: 150         # ~3.4k clips from smart-turn-data-v3.2-test for the regression check
  replay_max_files: 12

logging:
  wandb_project: marwari-eot
  wandb_entity: null
